name: index
on:
  push:
    branches: [main]
    # Only games changes trigger a rebuild — committing index.json (below) does
    # not re-trigger, so there's no loop.
    paths:
      - 'games/**'
      - 'build-index.mjs'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build-index.mjs
      - name: Commit index.json if it changed
        run: |
          if ! git diff --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "chore: rebuild index.json [skip ci]"
            git push
          else
            echo "index.json already up to date"
          fi
