<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Carrier Defense">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="boom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.4" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#7df9ff" opacity="0.7">
    <circle cx="60" cy="70" r="1.6"/><circle cx="140" cy="120" r="1.1"/><circle cx="230" cy="60" r="1.4"/>
    <circle cx="330" cy="100" r="1"/><circle cx="430" cy="55" r="1.6"/><circle cx="520" cy="120" r="1.2"/>
    <circle cx="560" cy="60" r="1"/><circle cx="90" cy="180" r="1"/><circle cx="490" cy="190" r="1.3"/>
    <circle cx="270" cy="150" r="1"/><circle cx="380" cy="175" r="1.1"/><circle cx="180" cy="210" r="1.2"/>
  </g>

  <!-- incoming missile trails -->
  <g stroke-linecap="round" filter="url(#glow)">
    <path d="M40 30 L210 320" stroke="#ff5a8a" stroke-width="3" opacity="0.85"/>
    <path d="M560 40 L360 300" stroke="#ff5a8a" stroke-width="3" opacity="0.85"/>
    <path d="M300 20 L300 250" stroke="#ff5a8a" stroke-width="2.5" opacity="0.7"/>
    <circle cx="210" cy="320" r="4" fill="#ff5a8a"/>
    <circle cx="360" cy="300" r="4" fill="#ff5a8a"/>
    <circle cx="300" cy="250" r="3.5" fill="#ff5a8a"/>
  </g>

  <!-- interceptor + airburst -->
  <circle cx="300" cy="250" r="60" fill="url(#boom)" opacity="0.9"/>
  <path d="M300 470 L300 255" stroke="#7df9ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- ground -->
  <rect x="0" y="470" width="600" height="130" fill="#0a1020"/>
  <line x1="0" y1="470" x2="600" y2="470" stroke="#7df9ff" stroke-width="2" opacity="0.6"/>

  <!-- defense towers -->
  <g fill="#7df9ff" filter="url(#glow)">
    <rect x="92" y="436" width="26" height="34" rx="2"/>
    <rect x="190" y="430" width="26" height="40" rx="2"/>
    <rect x="287" y="426" width="26" height="44" rx="2"/>
    <rect x="384" y="430" width="26" height="40" rx="2"/>
    <rect x="482" y="436" width="26" height="34" rx="2"/>
  </g>
  <g stroke="#7df9ff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="300" y1="426" x2="300" y2="404"/>
  </g>

  <!-- title -->
  <text x="300" y="540" text-anchor="middle" font-family="'Courier New',monospace" font-size="52" font-weight="bold" fill="#7df9ff" filter="url(#glow)" letter-spacing="2">CARRIER</text>
  <text x="300" y="582" text-anchor="middle" font-family="'Courier New',monospace" font-size="40" font-weight="bold" fill="#ffd23f" letter-spacing="6">DEFENSE</text>
</svg>
