<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap Target</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a14; overflow: hidden;
    font-family: system-ui, sans-serif; color: #e8f0ff;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #hud { position: fixed; top: 10px; left: 0; right: 0; text-align: center;
    font-size: 14px; letter-spacing: 0.1em; text-shadow: 0 0 6px #2dd4ff; }
  canvas { display: block; width: 100%; height: 100%; }
  #over { position: fixed; inset: 0; display: none; align-items: center;
    justify-content: center; flex-direction: column; gap: 14px;
    background: rgba(4, 5, 15, 0.85); }
  #over.show { display: flex; }
  button { font: inherit; padding: 10px 18px; border: 2px solid #2dd4ff;
    background: transparent; color: #2dd4ff; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="hud">SCORE <span id="score">0</span> &middot; TIME <span id="time">20</span></div>
<canvas id="c"></canvas>
<div id="over"><div id="final">GAME OVER</div><button id="again">PLAY AGAIN</button></div>
<script>
// A tiny, self-contained example game for the Oyster Arcade (Tier 1 / drop-in:
// no framework needed). It still speaks the small host protocol — reports its
// score on game over and closes on ESC — so it behaves well inside the cabinet.
// See ../../AGENTS.md.
const TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); addEventListener('resize', resize);

const scoreEl = document.getElementById('score'), timeEl = document.getElementById('time');
let score = 0, time = 20, running = true, best = null, target = spawn();

function spawn() { const r = 28; return { x: r + Math.random() * (W - 2 * r), y: 70 + r + Math.random() * (H - 140 - 2 * r), r }; }
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#2dd4ff'; ctx.beginPath(); ctx.arc(target.x, target.y, target.r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#0a0a14'; ctx.beginPath(); ctx.arc(target.x, target.y, target.r * 0.45, 0, TAU); ctx.fill();
  if (running) requestAnimationFrame(draw);
}
draw();

function hit(x, y) {
  if (!running) return;
  const dx = x - target.x, dy = y - target.y;
  if (dx * dx + dy * dy <= target.r * target.r) { score++; scoreEl.textContent = score; target = spawn(); }
}
cv.addEventListener('pointerdown', (e) => hit(e.clientX, e.clientY));

const timer = setInterval(() => { time--; timeEl.textContent = time; if (time <= 0) end(); }, 1000);
function end() {
  running = false; clearInterval(timer);
  const bestTxt = best ? '   BEST ' + best.score + ' ' + (best.initials || '') : '';
  document.getElementById('final').textContent = 'SCORE ' + score + bestTxt;
  document.getElementById('over').classList.add('show');
  post('arcade-score', { value: score });   // cabinet records it on the shared leaderboard
}
document.getElementById('again').addEventListener('click', () => location.reload());
addEventListener('keydown', (e) => { if (e.key === 'Escape') post('arcade-close'); });

// Host protocol: a versioned envelope, posted to the parent cabinet.
function post(type, payload) {
  try { parent.postMessage({ protocol: 'oyster-arcade', v: 1, type, payload }, '*'); } catch (_) {}
}
// The cabinet replies to arcade-ready with the shared high score — show that
// instead of keeping your own copy in localStorage (the cabinet owns the board).
addEventListener('message', (e) => {
  if (e.data && e.data.type === 'arcade-init') best = (e.data.payload && e.data.payload.highScore) || null;
});
post('arcade-ready');
</script>
</body>
</html>
